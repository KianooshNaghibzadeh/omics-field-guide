<svg aria-label="Splice site consensus elements" role="img" viewbox="0 0 900 200">
<rect fill="var(--rna)" height="40" width="170" x="20" y="70"></rect><text fill="var(--paper)" font-size="13" text-anchor="middle" x="105" y="95">Exon 1</text>
<rect fill="var(--rna)" height="40" width="170" x="710" y="70"></rect><text fill="var(--paper)" font-size="13" text-anchor="middle" x="795" y="95">Exon 2</text>
<line stroke="var(--ink-3)" stroke-width="3" x1="190" x2="710" y1="90" y2="90"></line>
<text font-size="13" font-weight="600" text-anchor="middle" x="190" y="60">MAG|GURAGU</text><text font-size="10" text-anchor="middle" x="190" y="140">5′ splice site (donor)</text><text fill="var(--ink-3)" font-size="10" text-anchor="middle" x="190" y="154">U1 snRNP binds</text>
<text font-size="13" font-weight="600" text-anchor="middle" x="500" y="60">YNYURAY</text><text font-size="10" text-anchor="middle" x="500" y="140">branch point (A)</text><text fill="var(--ink-3)" font-size="10" text-anchor="middle" x="500" y="154">SF1 → U2 snRNP</text>
<text font-size="13" font-weight="600" text-anchor="middle" x="615" y="60">(Y)n</text><text font-size="10" text-anchor="middle" x="615" y="140">polypyrimidine tract</text><text fill="var(--ink-3)" font-size="10" text-anchor="middle" x="615" y="154">U2AF65 binds</text>
<text font-size="13" font-weight="600" text-anchor="middle" x="710" y="60">YAG|G</text><text font-size="10" text-anchor="middle" x="710" y="140">3′ splice site (acceptor)</text><text fill="var(--ink-3)" font-size="10" text-anchor="middle" x="710" y="154">U2AF35 binds AG</text>
<circle cx="500" cy="90" fill="var(--met)" r="6"></circle>
<text fill="var(--ink-3)" font-size="10" x="20" y="190">R = A/G · Y = C/U · M = A/C · | = exon–intron boundary · ~99% of introns are GU–AG (U2-type); ~0.3% are AU–AC (U12-type minor spliceosome)</text>
</svg>